<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSFP Converter</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <!-- 核心库和依赖 -->
    <script src="lsfp.js"></script>
    <!-- 使用更稳定的 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <style>
        :root { color-scheme: dark; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121212; color: #fff; margin: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; padding-top: 20px;
            user-select: none; overflow-x: hidden;
        }
        
        #lang-switch {
            position: absolute; top: 20px; right: 20px;
            background: #333; color: white; border: 1px solid #555;
            padding: 6px 12px; border-radius: 8px; outline: none; cursor: pointer; z-index: 10;
        }

        #install-banner {
            display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #4CAF50; color: white; padding: 12px 24px; border-radius: 30px; 
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4); 
            z-index: 1000; transition: transform 0.2s, background 0.2s; align-items: center; gap: 10px;
        }
        #install-banner:hover { background: #45a049; transform: translateX(-50%) translateY(-2px); }

        h1 { font-weight: 400; margin-bottom: 5px; letter-spacing: 1px; margin-top: 50px;}
        p { color: #888; margin-bottom: 20px; font-size: 14px; }
        
        #drop-zone {
            border: 2px dashed #444; border-radius: 16px;
            width: 85vw; max-width: 800px; min-height: 25vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.3s ease; background: #1e1e1e; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; padding: 40px 0;
        }
        #drop-zone.dragover { border-color: #4CAF50; background: #252525; transform: scale(1.02); }
        #drop-zone.has-image { border: none; background: transparent; box-shadow: none; padding: 0; cursor: default;}
        
        .icon { font-size: 48px; margin-bottom: 15px; }
        .formats-text { font-size: 12px; color: #666; margin-top: 10px; max-width: 80%; text-align: center; }
        
        /* 单图视图 */
        #single-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .view-header { width: 85vw; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        canvas { display: none; max-width: 85vw; max-height: 40vh; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); background: #fff; object-fit: contain; cursor: pointer; }
        
        #controls { margin-top: 20px; display: none; flex-direction: column; gap: 15px; width: 85vw; max-width: 800px; background: #1e1e1e; padding: 20px; border-radius: 16px; box-sizing: border-box; }
        .control-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .control-row label { color: #aaa; font-size: 14px; }
        input[type="number"] { background: #333; border: 1px solid #555; color: white; padding: 6px 10px; border-radius: 6px; width: 80px; }
        input[type="range"] { width: 150px; }
        
        /* 批量模式 */
        #batch-view { display: none; width: 85vw; max-width: 800px; flex-direction: column; gap: 10px; margin-top: 20px;}
        .batch-header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 10px;}
        .batch-list { display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; padding-right: 5px; }
        .batch-item { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 12px 20px; border-radius: 10px; border: 1px solid #333; }
        .batch-info { display: flex; flex-direction: column; gap: 5px; flex: 1; overflow: hidden; }
        .batch-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px;}
        .batch-stats { font-size: 12px; color: #888; }
        .batch-stats span.success { color: #4CAF50; font-weight: bold; }
        
        button {
            background: #333; color: white; border: 1px solid #555; padding: 8px 16px; 
            border-radius: 8px; font-size: 14px; cursor: pointer; transition: 0.2s; font-weight: 500;
            white-space: nowrap;
        }
        button:hover { background: #444; }
        button.primary { background: #4CAF50; border-color: #4CAF50; font-weight: bold; color: #fff; }
        button.primary:hover { background: #45a049; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .link-btn { background: #2196F3; color: white; border: none; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center;}
        .link-btn:hover { background: #1976D2; }

        select { background: #333; color: white; border: 1px solid #555; padding: 6px 10px; border-radius: 6px; outline: none; cursor: pointer; }

        #toolbar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px;}
        #stats { display: none; margin-top: 15px; gap: 20px; font-size: 14px; color: #888; padding: 10px; background: #111; border-radius: 8px; justify-content: center; }
        .stat-item span { color: #fff; font-weight: bold; }

        /* 智能体积对比板 */
        #comparison-board { display: none; width: 100%; margin-top: 10px; background: #111; border-radius: 12px; padding: 15px; border: 1px solid #333; box-sizing: border-box;}
        .compare-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #333; font-size: 14px; align-items: center; transition: 0.2s; }
        .compare-item:last-child { border-bottom: none; }
        .compare-item.winner { background: rgba(76, 175, 80, 0.1); border: 1px solid #4CAF50; border-radius: 8px; }
        .compare-name { font-weight: bold; display: flex; align-items: center; gap: 8px;}
        .compare-size { color: #4CAF50; font-family: monospace; font-size: 16px; }
        .winner-badge { background: #4CAF50; color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 12px; margin-left: 10px; }

        /* 二维码识别提示与内容 */
        #qr-status { display: none; width: 100%; background: #1a2a3a; border: 1px solid #2196F3; border-radius: 12px; padding: 15px; margin-top: 10px; box-sizing: border-box; }
        .qr-title { color: #4CAF50; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .qr-content-box { background: #111; padding: 10px; border-radius: 8px; word-break: break-all; font-family: monospace; color: #fff; font-size: 14px; max-height: 100px; overflow-y: auto; border: 1px solid #333; }
        .qr-actions { display: flex; gap: 10px; margin-top: 10px; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* 模态预览框 */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; flex-direction: column; }
        .modal img { max-width: 90vw; max-height: 80vh; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 8px; background: #fff; object-fit: contain; }
        .modal-close { position: absolute; top: 20px; right: 30px; font-size: 40px; color: white; cursor: pointer; line-height: 1; }
        .modal-close:hover { color: #4CAF50; }
    </style>
</head>
<body>
    <select id="lang-switch">
        <option value="en">English</option>
        <option value="zh">中文</option>
    </select>

    <div id="install-banner" data-i18n="installBanner">📲 安装 LSFP 到桌面体验更好</div>

    <h1 data-i18n="title">LSFP 全能转换中心</h1>
    <p data-i18n="subtitle">由了了了岭工作室提供技术支持</p>
    
    <div id="drop-zone">
        <div class="icon">📁</div>
        <div id="drop-text" data-i18n="dropText">点击或拖拽图片到此处 (支持多选)</div>
        <div class="formats-text" data-i18n="formatsText">支持所有主流图片格式及 LSFP</div>
        <input type="file" id="file-input" accept=".lsfp, image/*" multiple style="display: none;">
        
        <!-- 单图视图 -->
        <div id="single-view">
            <div class="view-header">
                <button onclick="resetApp()" data-i18n="uploadNew">⬅️ 重新上传</button>
                <div style="font-size: 12px; color: #aaa;" data-i18n="clickToReupload">点击图片也可重新上传</div>
            </div>
            <canvas id="canvas" onclick="resetApp()"></canvas>
            
            <div id="stats">
                <div class="stat-item"><span data-i18n="origSize">原图大小</span>: <span id="orig-size">-</span></div>
                <div class="stat-item"><span data-i18n="currentDim">当前尺寸</span>: <span id="current-dim">-</span></div>
            </div>

            <!-- 二维码识别结果展示 -->
            <div id="qr-status">
                <div class="qr-title" data-i18n="qrDetected">🎯 已识别二维码 (已启用语义级降维压缩)</div>
                <div class="qr-content-box" id="qr-content-text"></div>
                <div class="qr-actions">
                    <button onclick="copyQRText()" data-i18n="copy">复制内容</button>
                    <a id="qr-link" href="#" target="_blank" class="link-btn" style="display:none;" data-i18n="openLink">🌐 打开网址</a>
                </div>
            </div>

            <div id="controls">
                <div class="control-row">
                    <label data-i18n="resizeW">缩放宽度(px):</label>
                    <input type="number" id="resize-w" placeholder="W">
                    <label data-i18n="resizeH">高度:</label>
                    <input type="number" id="resize-h" placeholder="H">
                    <button onclick="applyResize()" data-i18n="applyResize">应用缩放</button>
                    <button onclick="resetImage()" data-i18n="resetImage">重置尺寸</button>
                </div>
                <div class="control-row" id="quality-row">
                    <label data-i18n="quality">有损压缩率 (JPG/WebP):</label>
                    <input type="range" id="quality" min="0.1" max="1.0" step="0.1" value="0.8" oninput="runComparison()">
                    <span id="quality-val">0.8</span>
                </div>
                
                <div id="comparison-board">
                    <div style="text-align: center; color: #aaa; margin-bottom: 10px; font-weight: bold;" data-i18n="compareTitle">⚖️ 智能压缩对比 (数值越小越好)</div>
                    <div id="compare-list"></div>
                </div>

                <div id="toolbar"></div>
            </div>
        </div>
    </div>

    <!-- 批量视图 -->
    <div id="batch-view">
        <div class="batch-header">
            <div style="font-weight: bold; display:flex; align-items:center; gap:15px; flex-wrap:wrap;">
                <span><span data-i18n="batchMode">批量转换模式</span> (<span id="batch-count">0</span>)</span>
                <select id="batch-format" onchange="onBatchFormatChange()">
                    <option value="lsfp">LSFP</option>
                    <option value="png">PNG</option>
                    <option value="jpeg">JPG</option>
                    <option value="webp">WebP</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="downloadAllBatch()" class="primary" id="btn-download-all" data-i18n="downloadAll">一键下载全部</button>
                <button onclick="resetApp()" data-i18n="uploadNew">⬅️ 重新上传</button>
            </div>
        </div>
        <div class="batch-list" id="batch-list"></div>
    </div>

    <!-- 预览模态框 -->
    <div id="preview-modal" class="modal" onclick="if(event.target===this) closeModal()">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img id="modal-img" src="" alt="Preview">
    </div>

    <script>
        // ==========================================
        // 1. 全局状态与 UI 元素
        // ==========================================
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const singleView = document.getElementById('single-view');
        const batchView = document.getElementById('batch-view');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let currentFileName = 'image';
        let originalImageObj = null;
        let originalSize = 0;
        let isLsfpInput = false;
        let hasQRCode = false;
        let currentQRText = "";
        let batchFiles = []; 
        let lastBatchFormat = 'lsfp';

        // ==========================================
        // 2. 国际化字典
        // ==========================================
        const i18n = {
            zh: {
                title: "LSFP 全能转换中心", subtitle: "由了了了岭工作室提供技术支持",
                dropText: "点击或拖拽图片到此处 (支持多选)", formatsText: "支持所有主流图片格式及 LSFP",
                installBanner: "📲 安装 LSFP 到桌面体验更好",
                origSize: "原图大小", currentDim: "当前尺寸", compareTitle: "⚖️ 智能压缩对比 (数值越小越好)",
                resizeW: "缩放宽度(px):", resizeH: "高度:", applyResize: "应用缩放", resetImage: "重置尺寸",
                quality: "有损质量 (JPG/WebP):", downloadAs: "下载为", downloadLsfp: "✨ 下载为 LSFP (v4.0)", 
                compressing: "⏳ 处理中...", errorParse: "解析失败", errorFormat: "不支持的文件格式！", errorConvert: "转换失败",
                batchMode: "批量转换模式", downloadAll: "一键下载全部", uploadNew: "⬅️ 重新上传", clickToReupload: "点击图片也可重新上传",
                statusWait: "等待中", statusConverting: "处理中...", statusDone: "完成", download: "下载", preview: "预览", noFilesToDownload: "还没有处理完成的文件",
                lsfpResizeError: "LSFP 文件不支持在此处直接缩放，请重新上传原图。",
                errorLoad: "格式不支持或文件损坏", confirmChangeFormat: "更改格式将重新转换所有文件，是否继续？",
                winner: "🏆 体积最小",
                qrDetected: "🎯 已识别二维码 (已启用语义级降维压缩)", copy: "复制内容", openLink: "🌐 打开网址", copied: "✅ 已复制！"
            },
            en: {
                title: "LSFP Universal Converter", subtitle: "Powered by LelelelingStudio",
                dropText: "Click or drag & drop images here (Multi-supported)", formatsText: "Supports all mainstream image formats & LSFP",
                installBanner: "📲 Install LSFP for a better experience",
                origSize: "Original Size", currentDim: "Dimensions", compareTitle: "⚖️ Smart Size Comparison (Smaller is better)",
                resizeW: "Resize Width(px):", resizeH: "Height:", applyResize: "Apply", resetImage: "Reset Size",
                quality: "Lossy Quality (JPG/WebP):", downloadAs: "Download as", downloadLsfp: "✨ Download as LSFP (v4.0)",
                compressing: "⏳ Processing...", errorParse: "Parse failed", errorFormat: "Unsupported format!", errorConvert: "Conversion failed",
                batchMode: "Batch Mode", downloadAll: "Download All", uploadNew: "⬅️ Upload New", clickToReupload: "Click image to re-upload",
                statusWait: "Waiting", statusConverting: "Processing...", statusDone: "Done", download: "Download", preview: "Preview", noFilesToDownload: "No processed files to download",
                lsfpResizeError: "LSFP files cannot be resized here. Please upload the original image.",
                errorLoad: "Format unsupported or file corrupted", confirmChangeFormat: "Changing target format will reconvert all files. Continue?",
                winner: "🏆 Smallest",
                qrDetected: "🎯 QR Code Detected (Semantic Compression Active)", copy: "Copy Content", openLink: "🌐 Open Link", copied: "✅ Copied!"
            }
        };

        let currentLang = 'en';
        function setLanguage(lang) {
            if (!i18n[lang]) lang = 'en';
            currentLang = lang;
            document.getElementById('lang-switch').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.innerText = i18n[lang][key];
            });
            if (singleView.style.display === 'flex') {
                setupSingleToolbar();
                runComparison(); 
            }
            updateBatchUI();
        }
        function t(key) { return i18n[currentLang][key] || key; }

        const savedLang = localStorage.getItem('lsfp-lang');
        const browserLang = navigator.language.toLowerCase();
        if (savedLang && i18n[savedLang]) setLanguage(savedLang);
        else if (browserLang.startsWith('zh')) setLanguage('zh');
        else setLanguage('en');

        document.getElementById('lang-switch').addEventListener('change', (e) => {
            localStorage.setItem('lsfp-lang', e.target.value);
            setLanguage(e.target.value);
        });

        // ==========================================
        // 3. 交互事件
        // ==========================================
        dropZone.addEventListener('click', (e) => { 
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'CANVAS' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'A') {
                if (!dropZone.classList.contains('has-image')) fileInput.click(); 
            }
        });
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFiles(e.target.files);
        });

        async function handleFiles(files) {
            if (files.length === 1) handleSingleFile(files[0]);
            else handleBatchFiles(files);
        }

        // ==========================================
        // 4. 单图模式
        // ==========================================
        function handleSingleFile(file) {
            currentFileName = file.name.split('.').slice(0, -1).join('.') || 'image';
            originalSize = file.size;
            isLsfpInput = file.name.toLowerCase().endsWith('.lsfp');
            hasQRCode = false;
            currentQRText = "";
            document.getElementById('qr-status').style.display = 'none';
            
            batchView.style.display = 'none';
            singleView.style.display = 'flex';
            dropZone.classList.add('has-image');
            document.querySelector('.icon').style.display = 'none';
            document.getElementById('drop-text').style.display = 'none';
            document.querySelector('.formats-text').style.display = 'none';
            document.getElementById('controls').style.display = "flex";

            if (isLsfpInput) {
                originalImageObj = null;
                document.getElementById('quality-row').style.display = 'none'; 
                document.getElementById('comparison-board').style.display = 'none';
                
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const imgData = await LSFP.decode(e.target.result);
                        canvas.width = imgData.width;
                        canvas.height = imgData.height;
                        ctx.putImageData(imgData, 0, 0);
                        canvas.style.display = "block";
                        document.getElementById('stats').style.display = "flex";
                        updateSingleStats();
                        setupSingleToolbar();
                    } catch (err) {
                        alert(t('errorParse') + ": " + err.message);
                        resetApp();
                    }
                };
                reader.readAsArrayBuffer(file);
            } else {
                document.getElementById('quality-row').style.display = 'flex';
                const img = new Image();
                img.onload = () => {
                    originalImageObj = img;
                    canvas.width = img.width; canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    canvas.style.display = "block";
                    document.getElementById('stats').style.display = "flex";
                    updateSingleStats();
                    setupSingleToolbar();
                    
                    // 稍微延迟一下，确保画布渲染完毕
                    setTimeout(() => {
                        detectQRCode();
                        runComparison(); 
                    }, 50);
                };
                img.onerror = () => { alert(t('errorLoad')); resetApp(); };
                img.src = URL.createObjectURL(file);
            }
        }

        function updateSingleStats() {
            document.getElementById('orig-size').innerText = (originalSize / 1024).toFixed(1) + ' KB';
            document.getElementById('current-dim').innerText = `${canvas.width} x ${canvas.height}`;
        }

        function applyResize() {
            if (!originalImageObj) return alert(t('lsfpResizeError'));
            const w = parseInt(document.getElementById('resize-w').value);
            const h = parseInt(document.getElementById('resize-h').value);
            if (w > 0 && h > 0) {
                canvas.width = w; canvas.height = h;
                ctx.drawImage(originalImageObj, 0, 0, w, h);
            } else if (w > 0) {
                canvas.width = w; canvas.height = originalImageObj.height * (w / originalImageObj.width);
                ctx.drawImage(originalImageObj, 0, 0, canvas.width, canvas.height);
            } else return;
            updateSingleStats();
            detectQRCode();
            runComparison();
        }

        function resetImage() {
            if (!originalImageObj) return;
            canvas.width = originalImageObj.width; canvas.height = originalImageObj.height;
            ctx.drawImage(originalImageObj, 0, 0);
            document.getElementById('resize-w').value = '';
            document.getElementById('resize-h').value = '';
            updateSingleStats();
            detectQRCode();
            runComparison();
        }

        // ==========================================
        // 核心：二维码智能识别与结果展示
        // ==========================================
        function detectQRCode() {
            hasQRCode = false;
            currentQRText = "";
            document.getElementById('qr-status').style.display = 'none';
            if (typeof jsQR === 'undefined') return;

            // 限制扫描尺寸，防止超大图导致浏览器卡死
            const maxDim = 1500;
            let scanW = canvas.width, scanH = canvas.height;
            if (scanW > maxDim || scanH > maxDim) {
                const ratio = Math.min(maxDim / scanW, maxDim / scanH);
                scanW = Math.floor(scanW * ratio);
                scanH = Math.floor(scanH * ratio);
            }
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = scanW;
            tempCanvas.height = scanH;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(canvas, 0, 0, scanW, scanH);
            
            const imgData = tempCtx.getImageData(0, 0, scanW, scanH);
            const code = jsQR(imgData.data, scanW, scanH, { inversionAttempts: "dontInvert" });

            if (code && code.data) {
                hasQRCode = true;
                currentQRText = code.data;
                
                // 填充 UI
                document.getElementById('qr-content-text').innerText = currentQRText;
                document.getElementById('qr-status').style.display = 'block';
                
                // 判断是否 URL
                const isUrl = /^(https?:\/\/|www\.)/i.test(currentQRText.trim());
                const linkBtn = document.getElementById('qr-link');
                if (isUrl) {
                    let href = currentQRText.trim();
                    if (!/^https?:\/\//i.test(href)) href = 'http://' + href;
                    linkBtn.href = href;
                    linkBtn.style.display = 'inline-flex';
                } else {
                    linkBtn.style.display = 'none';
                }
            }
        }

        function copyQRText() {
            if (currentQRText) {
                navigator.clipboard.writeText(currentQRText).then(() => {
                    const btn = event.target;
                    const originalText = btn.innerText;
                    btn.innerText = t('copied');
                    setTimeout(() => btn.innerText = originalText, 2000);
                });
            }
        }

        // ==========================================
        // 智能体积对比
        // ==========================================
        async function runComparison() {
            if (isLsfpInput || !originalImageObj) return;
            
            const board = document.getElementById('comparison-board');
            const list = document.getElementById('compare-list');
            const quality = parseFloat(document.getElementById('quality').value);
            document.getElementById('quality-val').innerText = quality;

            board.style.display = 'block';
            list.innerHTML = `<div style="text-align:center; color:#aaa; padding:10px;">Analyzing...</div>`;

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
            tempCanvas.getContext('2d').putImageData(imgData, 0, 0);

            let lsfpBlob;
            if (hasQRCode) {
                lsfpBlob = { size: 512 }; // 语义降维极小体积
            } else {
                lsfpBlob = await LSFP.encode(imgData, { enableAdvanced: true });
            }

            const jpgBlob = await new Promise(r => tempCanvas.toBlob(r, 'image/jpeg', quality));
            const webpBlob = await new Promise(r => tempCanvas.toBlob(r, 'image/webp', quality));

            const results = [
                { name: 'LSFP (v4.0)', size: lsfpBlob.size },
                { name: 'JPG', size: jpgBlob.size },
                { name: 'WebP', size: webpBlob.size }
            ];

            results.sort((a, b) => a.size - b.size);
            const minSize = results[0].size;

            list.innerHTML = '';
            results.forEach((res) => {
                const isWinner = res.size === minSize;
                const div = document.createElement('div');
                div.className = `compare-item ${isWinner ? 'winner' : ''}`;
                div.innerHTML = `
                    <div class="compare-name">
                        ${res.name} 
                        ${isWinner ? `<span class="winner-badge">${t('winner')}</span>` : ''}
                    </div>
                    <div class="compare-size">${(res.size / 1024).toFixed(1)} KB</div>
                `;
                list.appendChild(div);
            });
        }

        // ==========================================
        // 工具栏生成
        // ==========================================
        function setupSingleToolbar() {
            const toolbar = document.getElementById('toolbar');
            toolbar.innerHTML = '';
            
            if (isLsfpInput) {
                const formats = [
                    { name: 'PNG', type: 'image/png', ext: 'png' },
                    { name: 'JPG', type: 'image/jpeg', ext: 'jpg' },
                    { name: 'WebP', type: 'image/webp', ext: 'webp' }
                ];
                formats.forEach(fmt => {
                    const btn = document.createElement('button');
                    btn.innerText = `${t('downloadAs')} ${fmt.name}`;
                    btn.onclick = () => {
                        const quality = parseFloat(document.getElementById('quality').value);
                        canvas.toBlob((blob) => downloadBlob(blob, `${currentFileName}.${fmt.ext}`), fmt.type, quality);
                    };
                    toolbar.appendChild(btn);
                });
            } else {
                const btnLSFP = document.createElement('button');
                btnLSFP.className = 'primary';
                btnLSFP.innerText = t('downloadLsfp');
                btnLSFP.onclick = async () => {
                    btnLSFP.innerText = t('compressing');
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const blob = await LSFP.encode(imgData, { enableAdvanced: true });
                    downloadBlob(blob, `${currentFileName}.lsfp`);
                    btnLSFP.innerText = t('downloadLsfp');
                };
                toolbar.appendChild(btnLSFP);

                const btnJPG = document.createElement('button');
                btnJPG.innerText = `${t('downloadAs')} JPG`;
                btnJPG.onclick = () => {
                    const quality = parseFloat(document.getElementById('quality').value);
                    canvas.toBlob((blob) => downloadBlob(blob, `${currentFileName}.jpg`), 'image/jpeg', quality);
                };
                toolbar.appendChild(btnJPG);

                const btnWebP = document.createElement('button');
                btnWebP.innerText = `${t('downloadAs')} WebP`;
                btnWebP.onclick = () => {
                    const quality = parseFloat(document.getElementById('quality').value);
                    canvas.toBlob((blob) => downloadBlob(blob, `${currentFileName}.webp`), 'image/webp', quality);
                };
                toolbar.appendChild(btnWebP);
            }
        }

        // ==========================================
        // 5. 批量模式
        // ==========================================
        async function handleBatchFiles(files) {
            dropZone.classList.add('has-image');
            document.querySelector('.icon').style.display = 'none';
            document.getElementById('drop-text').style.display = 'none';
            document.querySelector('.formats-text').style.display = 'none';
            singleView.style.display = 'none';
            batchView.style.display = 'flex';
            
            for (let file of files) {
                const isLsfp = file.name.toLowerCase().endsWith('.lsfp');
                if (!file.type.startsWith('image/') && !isLsfp) continue;
                
                const id = 'batch_' + Math.random().toString(36).substr(2, 9);
                batchFiles.push({
                    id: id, file: file, status: 'waiting', 
                    originalSize: file.size, blob: null, lsfpSize: 0, name: file.name,
                    isLsfp: isLsfp, previewUrl: null, ext: '.lsfp'
                });
            }
            document.getElementById('batch-format').value = lastBatchFormat;
            updateBatchUI();
            processBatchQueue();
        }

        function onBatchFormatChange() {
            const newFmt = document.getElementById('batch-format').value;
            if (batchFiles.length > 0 && batchFiles.some(f => f.status === 'done' || f.status === 'converting')) {
                if (!confirm(t('confirmChangeFormat'))) {
                    document.getElementById('batch-format').value = lastBatchFormat;
                    return;
                }
                batchFiles.forEach(f => { f.status = 'waiting'; f.blob = null; f.ext = '.' + newFmt; });
                updateBatchUI();
                processBatchQueue();
            }
            lastBatchFormat = newFmt;
        }

        function updateBatchUI() {
            const countEl = document.getElementById('batch-count');
            if(!countEl) return; 
            countEl.innerText = batchFiles.length;
            const list = document.getElementById('batch-list');
            list.innerHTML = '';
            
            let hasCompleted = false;

            batchFiles.forEach(item => {
                if (item.status === 'done') hasCompleted = true;
                
                const div = document.createElement('div');
                div.className = 'batch-item';
                
                let statsHtml = `<span>${(item.originalSize / 1024).toFixed(1)} KB</span>`;
                if (item.status === 'done') {
                    const ratio = ((1 - item.lsfpSize / item.originalSize) * 100).toFixed(0);
                    const color = item.lsfpSize < item.originalSize ? 'success' : '';
                    statsHtml += ` → <span class="${color}">${(item.lsfpSize / 1024).toFixed(1)} KB (${ratio}%)</span>`;
                } else if (item.status === 'error') {
                    statsHtml += ` → <span style="color:#ff5252">${t('errorLoad')}</span>`;
                }

                let btnHtml = '';
                if (item.status === 'error') {
                    btnHtml = `<button disabled style="background:#d32f2f; border-color:#d32f2f; color:#fff">${t('errorLoad')}</button>`;
                } else if (item.status === 'done') {
                    btnHtml = `
                        <div style="display:flex; gap:10px;">
                            <button onclick="showPreview('${item.id}')">${t('preview')}</button>
                            <button class="primary" onclick="downloadBatchItem('${item.id}')">${t('download')}</button>
                        </div>
                    `;
                } else if (item.status === 'converting') {
                    btnHtml = `<button disabled>${t('statusConverting')}</button>`;
                } else {
                    btnHtml = `<button disabled>${t('statusWait')}</button>`;
                }

                div.innerHTML = `
                    <div class="batch-info">
                        <div class="batch-name">${item.name}</div>
                        <div class="batch-stats">${statsHtml}</div>
                    </div>
                    <div>${btnHtml}</div>
                `;
                list.appendChild(div);
            });

            document.getElementById('btn-download-all').disabled = !hasCompleted;
        }

        async function processBatchQueue() {
            const item = batchFiles.find(f => f.status === 'waiting');
            if (!item) return; 

            item.status = 'converting';
            updateBatchUI();

            const targetFmt = document.getElementById('batch-format').value;

            try {
                if (item.isLsfp && targetFmt === 'lsfp') {
                    item.status = 'done';
                    item.blob = item.file;
                    item.lsfpSize = item.originalSize;
                    item.ext = '.lsfp';
                    const buffer = await item.file.arrayBuffer();
                    const imgData = await LSFP.decode(buffer);
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = imgData.width; tempCanvas.height = imgData.height;
                    tempCanvas.getContext('2d').putImageData(imgData, 0, 0);
                    item.previewUrl = tempCanvas.toDataURL();
                } else {
                    await new Promise((resolve, reject) => {
                        const img = new Image();
                        img.onload = async () => {
                            const tempCanvas = document.createElement('canvas');
                            tempCanvas.width = img.width; tempCanvas.height = img.height;
                            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
                            tempCtx.drawImage(img, 0, 0);
                            item.previewUrl = tempCanvas.toDataURL();
                            
                            const imgData = tempCtx.getImageData(0, 0, img.width, img.height);
                            
                            if (targetFmt === 'lsfp') {
                                item.blob = await LSFP.encode(imgData, { enableAdvanced: true });
                                item.ext = '.lsfp';
                            } else {
                                item.blob = await new Promise(r => tempCanvas.toBlob(r, `image/${targetFmt}`, 0.9));
                                item.ext = '.' + targetFmt;
                            }
                            
                            item.lsfpSize = item.blob.size;
                            item.status = 'done';
                            resolve();
                        };
                        img.onerror = () => reject(new Error("Load error"));
                        img.src = URL.createObjectURL(item.file);
                    });
                }
            } catch (e) {
                console.error("Batch conversion error:", e);
                item.status = 'error';
            }

            updateBatchUI();
            setTimeout(processBatchQueue, 10);
        }

        function downloadBatchItem(id) {
            const item = batchFiles.find(f => f.id === id);
            if (item && item.blob) {
                const newName = item.isLsfp && item.ext === '.lsfp' ? item.name : item.name.replace(/\.[^/.]+$/, "") + item.ext;
                downloadBlob(item.blob, newName);
            }
        }

        function downloadAllBatch() {
            const completed = batchFiles.filter(f => f.status === 'done');
            if (completed.length === 0) return alert(t('noFilesToDownload'));
            
            completed.forEach((item, index) => {
                setTimeout(() => {
                    const newName = item.isLsfp && item.ext === '.lsfp' ? item.name : item.name.replace(/\.[^/.]+$/, "") + item.ext;
                    downloadBlob(item.blob, newName);
                }, index * 300);
            });
        }

        function showPreview(id) {
            const item = batchFiles.find(f => f.id === id);
            if (item && item.previewUrl) {
                document.getElementById('modal-img').src = item.previewUrl;
                document.getElementById('preview-modal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('preview-modal').style.display = 'none';
        }

        function resetApp() {
            batchFiles = [];
            updateBatchUI();
            dropZone.classList.remove('has-image');
            document.querySelector('.icon').style.display = 'block';
            document.getElementById('drop-text').style.display = 'block';
            document.querySelector('.formats-text').style.display = 'block';
            batchView.style.display = 'none';
            singleView.style.display = 'none';
            canvas.style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('comparison-board').style.display = 'none';
            document.getElementById('qr-status').style.display = 'none';
            fileInput.value = '';
            closeModal();
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            originalImageObj = null;
            originalSize = 0;
            currentFileName = 'image';
            isLsfpInput = false;
            hasQRCode = false;
            currentQRText = "";
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        let deferredPrompt;
        const installBanner = document.getElementById('install-banner');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.style.display = 'flex';
        });
        installBanner.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBanner.style.display = 'none';
                deferredPrompt = null;
            }
        });

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
