[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lsfp" # 别人 pip install 的名字
version = "1.0.0"
description = "A hybrid image compression format by LelelelingStudio"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "LelelelingStudio", email = "hello@leleleling.site" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pillow>=9.0.0" # 自动安装的依赖
]

[tool.setuptools]
packages = ["lsfp"]